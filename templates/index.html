{% extends "base.html" %}

{% block header_extra %}
<div class="tagline">
   PDF Itinerary → Quotations Database
</div>
<div class="rule"></div>
{% endblock %}

{% block content %}

    <div class="card upload-card container--sm">
      <form id="upload-form" method="POST" action="/upload" enctype="multipart/form-data">

        <div class="dropzone" id="dropzone">
          <input type="file" name="pdf" id="file-input" accept=".pdf">
          <span class="dropzone__icon">&#128196;</span>
          <span class="dropzone__label">Drop booking PDF here</span>
          <span class="dropzone__sub">or click to browse</span>
        </div>

        <div class="file-pill" id="file-pill">
          <span>&#128206;</span>
          <span class="file-pill__name" id="pill-name"></span>
          <button type="button" class="file-pill__remove" id="pill-remove" aria-label="Remove file">&#10005;</button>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="submit-btn" disabled>
          Extract &amp; Review
        </button>

        <div id="loading-indicator" class="loading-message" style="display: none; margin-top: 16px; text-align: center; color: #666; font-size: 14px;">
          <span class="spinner"></span>
          <span>Processing your PDF...</span>
        </div>

      </form>

      <div id="error-box"
           class="alert alert--error"
           style="margin-top:18px; display: none;">
        <span id="error-message"></span>
      </div>
    </div>


{% endblock %}
